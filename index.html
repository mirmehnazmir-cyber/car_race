<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coast Road Rally</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8e2d4;--ink:#1d2b33;--muted:#5d6b73;--accent:#e0a100;--panel:#fffdf7;--line:#c9c1ae;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14202a;--ink:#f1ede2;--muted:#9fb0ba;--panel:#1c2c38;--line:#2f4352}}
:root[data-theme="dark"]{--bg:#14202a;--ink:#f1ede2;--muted:#9fb0ba;--panel:#1c2c38;--line:#2f4352}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px 12px 24px}
h1{font-family:"Archivo Black",Impact,sans-serif;font-size:clamp(1.6rem,5vw,2.4rem);margin:0 0 4px;letter-spacing:-.5px}
.sub{margin:0 0 14px;color:var(--muted);font-size:.95rem}
.stage{position:relative;width:min(360px,100%);aspect-ratio:360/560;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:#3b4048;touch-action:none}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;font-family:"Archivo Black",Impact,sans-serif;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);font-size:.95rem;pointer-events:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(20,32,42,.78);color:#fff;text-align:center;padding:24px}
.overlay h2{font-family:"Archivo Black",Impact,sans-serif;font-size:1.8rem;margin:0}
.overlay p{margin:0;max-width:26ch;line-height:1.4;color:#dfe7ea}
button{font:inherit;font-family:"Archivo Black",Impact,sans-serif;background:var(--accent);color:#1d2b33;border:0;border-radius:8px;padding:12px 26px;font-size:1.05rem;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.pad{display:none;width:min(360px,100%);gap:10px;margin-top:12px}
.pad button{flex:1;padding:18px 0;font-size:1.4rem;user-select:none;-webkit-user-select:none;touch-action:none}
@media (pointer:coarse){.pad{display:flex}}
.help{margin-top:12px;color:var(--muted);font-size:.9rem;text-align:center;max-width:360px}
.hidden{display:none}
</style>
</head>
<body>
<h1>Coast Road Rally</h1>
<p class="sub">Dodge the traffic. Hold the line as the road speeds up.</p>
<div class="stage" id="stage">
  <canvas id="c" width="360" height="560" aria-label="Car race game"></canvas>
  <div class="hud"><span id="score">Score 0</span><span id="best">Best 0</span></div>
  <div class="overlay" id="ov">
    <h2 id="ovTitle">Ready to race?</h2>
    <p id="ovText">Steer with the arrow keys or A / D. Up speeds you up, down brakes.</p>
    <button id="go">Start race</button>
  </div>
</div>
<div class="pad" id="pad">
  <button id="bL" aria-label="Steer left">&#9664;</button>
  <button id="bR" aria-label="Steer right">&#9654;</button>
</div>
<p class="help">Keys: ← → or A D to steer, ↑ ↓ to speed up or brake, Space to start.</p>

<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=360,H=560,RX=50,RW=260,LANE=RW/4;
var scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
var ov=document.getElementById('ov'),ovT=document.getElementById('ovTitle'),ovP=document.getElementById('ovText'),goBtn=document.getElementById('go');
var best=0;
try{best=parseInt(localStorage.getItem('coast-best')||'0',10)||0}catch(e){}
bestEl.textContent='Best '+best;

var state='ready',player,cars,speed,target,dist,spawnT,dash,last,keys={},touch={l:false,r:false};
var COLORS=['#d1495b','#2e86ab','#6a994e','#8d5a97','#f4f1de','#ee964b'];

function reset(){
  player={x:W/2-17,y:H-120,w:34,h:60,vx:0};
  cars=[];speed=5;target=5;dist=0;spawnT=0;dash=0;
}
function drawCar(x,y,w,h,col,up){
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(x+3,y+4,w,h);
  ctx.fillStyle='#111';
  ctx.fillRect(x-3,y+8,4,14);ctx.fillRect(x+w-1,y+8,4,14);
  ctx.fillRect(x-3,y+h-22,4,14);ctx.fillRect(x+w-1,y+h-22,4,14);
  ctx.fillStyle=col;
  rr(x,y,w,h,8);ctx.fill();
  ctx.fillStyle='rgba(20,30,40,.85)';
  rr(x+5,y+(up?14:h-30),w-10,16,3);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.18)';
  ctx.fillRect(x+w/2-1,y+(up?32:6),2,h-38);
  ctx.fillStyle=up?'#fff6c2':'#ff4d4d';
  ctx.fillRect(x+4,y+(up?2:h-5),7,3);ctx.fillRect(x+w-11,y+(up?2:h-5),7,3);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function spawn(){
  var lane=Math.floor(Math.random()*4),x=RX+lane*LANE+(LANE-34)/2;
  for(var i=0;i<cars.length;i++){if(cars[i].lane===lane&&cars[i].y<80)return;}
  cars.push({lane:lane,x:x,y:-70,w:34,h:60,v:1.5+Math.random()*2.5,c:COLORS[Math.floor(Math.random()*COLORS.length)]});
}
function update(dt){
  var k=dt*60;
  if(keys.ArrowUp||keys.w)target=Math.min(14,target+0.06*k);
  if(keys.ArrowDown||keys.s)target=Math.max(4,target-0.1*k);
  target=Math.min(14,target+0.0015*k);
  speed+=(target-speed)*0.05*k;
  var dir=0;
  if(keys.ArrowLeft||keys.a||touch.l)dir-=1;
  if(keys.ArrowRight||keys.d||touch.r)dir+=1;
  player.vx+=(dir*5.5-player.vx)*0.2*k;
  player.x+=player.vx*k;
  if(player.x<RX+4){player.x=RX+4;player.vx=0}
  if(player.x>RX+RW-player.w-4){player.x=RX+RW-player.w-4;player.vx=0}
  dash=(dash+speed*k)%60;
  dist+=speed*k*0.05;
  spawnT-=k;
  if(spawnT<=0){spawn();spawnT=Math.max(18,70-speed*3.5)+Math.random()*25}
  for(var i=cars.length-1;i>=0;i--){
    var c=cars[i];c.y+=(speed-c.v)*k;
    if(c.y>H+80||c.y<-400)cars.splice(i,1);
    else if(c.x+c.w-4>player.x+3&&c.x+4<player.x+player.w-3&&c.y+c.h-4>player.y+4&&c.y+4<player.y+player.h-4){crash();return}
  }
  scoreEl.textContent='Score '+Math.floor(dist);
}
function crash(){
  state='over';
  var s=Math.floor(dist),isBest=s>best;
  if(isBest){best=s;try{localStorage.setItem('coast-best',String(best))}catch(e){}}
  bestEl.textContent='Best '+best;
  ovT.textContent='Crash!';
  ovP.textContent='You scored '+s+(isBest?' — a new best.':'. Best is '+best+'.');
  goBtn.textContent='Race again';
  ov.classList.remove('hidden');goBtn.focus();
}
function draw(){
  // shoulders: sea on left, sand on right
  ctx.fillStyle='#2f8f9d';ctx.fillRect(0,0,RX,H);
  ctx.fillStyle='#e4cf98';ctx.fillRect(RX+RW,0,W-RX-RW,H);
  ctx.fillStyle='rgba(255,255,255,.35)';
  for(var y=-60+dash;y<H;y+=60){ctx.fillRect(10,y,24,3);ctx.fillRect(RX+RW+12,y+25,5,5);ctx.fillRect(RX+RW+38,y+8,4,4)}
  // road
  ctx.fillStyle='#3b4048';ctx.fillRect(RX,0,RW,H);
  ctx.fillStyle='#f2efe6';ctx.fillRect(RX,0,4,H);ctx.fillRect(RX+RW-4,0,4,H);
  for(var l=1;l<4;l++){for(var y=-60+dash;y<H;y+=60){ctx.fillRect(RX+l*LANE-2,y,4,30)}}
  for(var i=0;i<cars.length;i++){var c=cars[i];drawCar(c.x,c.y,c.w,c.h,c.c,false)}
  drawCar(player.x,player.y,player.w,player.h,'#e0a100',true);
  if(speed>9){ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=2;for(var j=0;j<6;j++){var sx=RX+((j*53+dash*3)%RW),sy=(j*97+dash*7)%H;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx,sy+26);ctx.stroke()}}
}
function loop(t){
  var dt=Math.min(0.05,(t-(last||t))/1000);last=t;
  if(state==='play')update(dt);
  draw();
  requestAnimationFrame(loop);
}
function start(){
  reset();state='play';ov.classList.add('hidden');scoreEl.textContent='Score 0';
}
goBtn.addEventListener('click',start);
window.addEventListener('keydown',function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].indexOf(e.key)>-1)e.preventDefault();
  if(e.key===' '&&state!=='play'){start();return}
  keys[k]=true;
});
window.addEventListener('keyup',function(e){keys[e.key.length===1?e.key.toLowerCase():e.key]=false});
function hold(id,side){
  var b=document.getElementById(id);
  ['pointerdown'].forEach(function(n){b.addEventListener(n,function(e){e.preventDefault();touch[side]=true})});
  ['pointerup','pointerleave','pointercancel'].forEach(function(n){b.addEventListener(n,function(){touch[side]=false})});
}
hold('bL','l');hold('bR','r');
var stage=document.getElementById('stage');
stage.addEventListener('pointerdown',function(e){
  if(state!=='play'||e.target.closest('button'))return;
  var r=stage.getBoundingClientRect();
  if(e.clientX-r.left<r.width/2)touch.l=true;else touch.r=true;
});
['pointerup','pointercancel','pointerleave'].forEach(function(n){stage.addEventListener(n,function(){touch.l=false;touch.r=false})});
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
